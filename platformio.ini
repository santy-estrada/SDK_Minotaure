; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; More info: https://arduino-pico.readthedocs.io/en/latest/platformio.html

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = nanorp2040connect
framework = arduino
board_build.core = earlephilhower
; Enable FreeRTOS Support
;build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS

; Basic code to test that everything is properly set up and working.
[env:Blink]
build_src_filter =-<*> +<Blink/**>

; Code to test the Motor class (no encoders)
[env:Motor]
build_src_filter =-<*> +<Motor_test/**>
